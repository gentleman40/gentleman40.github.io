<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Портфолио веб-разработчика — проекты, контакты и вход/регистрация.">
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <title>Портфолио разработчика</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* subtle decorative background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.06) 1px, transparent 1px),
                radial-gradient(circle at 90% 80%, rgba(255,255,255,0.04) 1px, transparent 1px),
                radial-gradient(circle at 50% 40%, rgba(255,255,255,0.03) 1px, transparent 1px);
            pointer-events: none;
            z-index: -1;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        nav {
            background: #007bff;
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border-bottom: 1px solid #0056b3;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
            gap: 0.3rem;
            max-width: 100vw;
        }

        nav li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.92rem;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            white-space: nowrap;
        }

        nav li a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .neon-title {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            padding: 0;
            margin: 15px 0 10px;
            letter-spacing: 2px;
            animation: title-rainbow 4s infinite alternate;
            text-shadow: 0 0 10px currentColor;
            width: 100%;
        }

        @keyframes title-rainbow {
            0%   { color: #00ffcc; }
            25%  { color: #00ccff; }
            50%  { color: #ffff00; }
            75%  { color: #ff5500; }
            100% { color: #33ff99; }
        }

        .neon-frame {
            width: 100%;
            padding-top: 56.25%;
            border: 4px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            animation: neon-pulse 3.5s infinite alternate;
            box-shadow: 0 0 20px #00ffcc;
            margin: 0 0 16px;
            background: #000;
        }

        .neon-frame img,
        .neon-frame video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
        }

        @keyframes neon-pulse {
            0%   { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc, 0 0 35px #00ffcc; }
            50%  { border-color: #00ccff; box-shadow: 0 0 20px #00ccff, 0 0 35px #00ccff; }
            100% { border-color: #33ff99; box-shadow: 0 0 20px #33ff99, 0 0 35px #33ff99; }
        }

        .neon-btn {
            display: inline-block;
            padding: 10px 28px;
            background: transparent;
            color: #ff0000;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #ff0000;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px #ff0000;
            margin: 24px 0;
        }

        .neon-btn:hover {
            background: rgba(255, 0, 0, 0.15);
            box-shadow: 0 0 20px #ff3333, 0 0 35px #ff3333;
            color: white;
        }

        /* НОВЫЙ СТИЛЬ ФОРМЫ АВТОРИЗАЦИИ */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: #0a0a0a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
            margin: 0 0 40px;
        }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all 0.3s;
            z-index: 10;
        }

        .close-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .login-header {
            padding: 40px 30px 25px;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .gentleman-text {
            text-align: center;
            padding: 0 30px 20px;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            background: #1a1a1a;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            background: #252525;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
        }

        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
            font-size: 16px;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: #2d2d2d;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-button:hover {
            background: #3a3a3a;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 25px 0;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .social-button:hover {
            background: #252525;
            border-color: #3a3a3a;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        .social-icon svg {
            width: 24px;
            height: 24px;
        }

        .social-icon.google {
            background: #4285F4;
            border-radius: 50%;
            color: white;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #2d2d2d;
        }

        .divider-text {
            color: #888;
            font-size: 14px;
            font-weight: 500;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .register-link {
            color: #76b0ff;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.2s;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .forgot-link {
            color: #76b0ff;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.2s;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .auth-message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #ff5555;
            text-shadow: 0 0 8px #ff5555;
            min-height: 1.2em;
            padding: 10px;
            background: rgba(255, 85, 85, 0.1);
            border-radius: 6px;
        }

        footer {
            background: rgba(10, 10, 25, 0.9);
            color: #bbb;
            text-align: center;
            padding: 0.625rem 0;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            box-sizing: border-box;
            padding-bottom: max(0.625rem, env(safe-area-inset-bottom));
        }

        .sr-only {
            position: absolute !important;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0);
            white-space: nowrap; border: 0;
        }

        @media (max-width: 600px) {
            .main-content {
                padding: 1.25rem 1rem;
            }
            .neon-title {
                font-size: 1.3rem;
                margin: 15px 0 8px;
            }
            .neon-frame {
                padding-top: 60%;
            }
            .neon-btn {
                margin: 20px 0;
                font-size: 1rem;
                padding: 8px 24px;
            }
            .login-container {
                max-width: 100%;
                border-radius: 12px;
            }
            .login-title {
                font-size: 24px;
            }
            .input-field {
                padding: 14px 16px;
                font-size: 15px;
            }
            .login-button {
                padding: 14px;
                font-size: 16px;
            }
            .social-button {
                padding: 14px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <nav aria-label="Основная навигация">
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="about.html">Обо мне</a></li>
            <li><a href="portfolio.html">Портфолио</a></li>
            <li><a href="contact.html">Контакты</a></li>
            <li><a href="calculator.html">Калькулятор</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <h1 class="neon-title">↓ ВЕБ РАЗРАБОТКА ↓</h1>

        <div class="neon-frame" aria-hidden="false">
            <img src="https://github.com/user-attachments/assets/2666e1d1-fd0f-4720-bca2-131acb35cabe"
                 alt="Портрет разработчика / превью проекта" loading="lazy">
        </div>

        <a href="portfolio.html" class="neon-btn" role="button">Смотреть проекты</a>

        <!-- НОВАЯ ФОРМА АВТОРИЗАЦИИ -->
        <div class="login-container">
            <button class="close-button" id="closeAuthBtn" aria-label="Закрыть">✕</button>

            <div class="login-header">
                <h1 class="login-title">Добро пожаловать</h1>
            </div>

            <div class="gentleman-text">GENTLEMAN40</div>

            <div style="padding: 30px">
                <form id="loginForm" novalidate>
                    <div class="input-group">
                        <label class="input-label" for="loginEmail">Эл. адрес</label>
                        <input type="email" id="loginEmail" class="input-field" placeholder="Эл. адрес" autocomplete="email" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" class="input-field" placeholder="Пароль" autocomplete="current-password" minlength="6" required>
                        <span class="password-toggle" id="passwordToggle">👁️</span>
                    </div>

                    <button type="submit" class="login-button" id="loginBtn">Вход</button>
                </form>

                <div class="login-options">
                    <a href="#" class="register-link" id="showRegister">У вас нет аккаунта? Зарегистрируйтесь</a>
                    <a href="#" class="forgot-link">Забыли пароль</a>
                </div>

                <div class="gentleman-text">GENTLEMAN40</div>

                <div class="divider">
                    <div class="divider-line"></div>
                    <div class="divider-text">или</div>
                    <div class="divider-line"></div>
                </div>

                <div class="social-login">
                    <button class="social-button" id="googleLoginBtn">
                        <span class="social-icon google">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.4-3.3-7.4-7.3 0-4.095 3.305-7.3 7.4-7.3 2.167 0 3.983 1.124 5.055 2.877L12.24 10.285z" fill="white"/>
                            </svg>
                        </span>
                        Войти через Google
                    </button>
                </div>

                <div class="auth-message" id="authMessage" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025. Все права защищены.</p>
    </footer>

    <script type="module">
        // ИСПРАВЛЕНО: убраны пробелы в конце путей импорта!
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKcUnzPEilGxOXB2L5QYLr0Kw7fgI_hCY",
            authDomain: "testik-b6f72.firebaseapp.com",
            projectId: "testik-b6f72",
            storageBucket: "testik-b6f72.firebasestorage.app",
            messagingSenderId: "398523760786",
            appId: "1:398523760786:web:35ecca7778ebe25564a64b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function getErrorMessage(error) {
            const code = error?.code || '';
            switch (code) {
                case 'auth/invalid-credential':
                case 'auth/wrong-password':
                case 'auth/user-not-found':
                    return '❌ НЕВЕРНЫЙ ЛОГИН ИЛИ ПАРОЛЬ!';
                case 'auth/email-already-in-use':
                    return '📧 Этот email уже используется!';
                case 'auth/invalid-email':
                    return '📧 Неверный формат email!';
                case 'auth/weak-password':
                    return '🔒 Пароль слишком слабый! Минимум 6 символов.';
                case 'auth/popup-closed-by-user':
                    return '🚪 Вы закрыли окно авторизации.';
                case 'auth/popup-blocked':
                    return '⚠️ Всплывающее окно заблокировано. Разрешите всплывающие окна.';
                case 'auth/network-request-failed':
                    return '🌐 Ошибка сети. Проверьте подключение.';
                default:
                    return error?.message || 'Произошла ошибка. Попробуйте позже.';
            }
        }

        function showMessage(text) {
            const el = document.getElementById('authMessage');
            if (el) {
                el.innerText = text;
                // Очистка сообщения через 5 секунд
                setTimeout(() => {
                    if (el.innerText === text) el.innerText = '';
                }, 5000);
            }
        }

        // Переключатель видимости пароля
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('loginPassword');

        if (passwordToggle && passwordInput) {
            passwordToggle.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🙈';
            });
        }

        // Кнопка закрытия - выход из системы
        const closeAuthBtn = document.getElementById('closeAuthBtn');
        if (closeAuthBtn) {
            closeAuthBtn.addEventListener('click', function() {
                if (confirm('Выйти из системы?')) {
                    auth.signOut().then(() => {
                        showMessage('✅ Выход выполнен!');
                        setTimeout(() => {
                            window.location.reload();
                        }, 1000);
                    }).catch((error) => {
                        console.error('Sign out error:', error);
                        showMessage('❌ Ошибка при выходе');
                    });
                }
            });
        }

        // Вход по email/паролю
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail')?.value.trim();
            const password = document.getElementById('loginPassword')?.value;

            if (!email || !password) {
                showMessage('⚠️ Заполните все поля!');
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.textContent = 'Вход...';
                loginBtn.disabled = true;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage('✅ Вход выполнен!');
                // Оставляем на странице, без перенаправления
            } catch (error) {
                console.error('Login error:', error);
                showMessage(getErrorMessage(error));
            } finally {
                if (loginBtn) {
                    loginBtn.textContent = 'Вход';
                    loginBtn.disabled = false;
                }
            }
        });

        // Переключение на регистрацию
        document.getElementById('showRegister')?.addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('Регистрация будет доступна позже!');
        });

        // Вход через Google
        document.getElementById('googleLoginBtn')?.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();

            try {
                showMessage('⏳ Авторизация через Google...');
                const result = await signInWithPopup(auth, provider);

                const user = result.user;
                console.log('Успешный вход:', {
                    email: user.email,
                    name: user.displayName
                });

                showMessage('✅ Вход через Google выполнен!');
            } catch (error) {
                console.error('Google login error:', error);

                // Не показываем ошибку, если пользователь сам закрыл окно
                if (error.code !== 'auth/popup-closed-by-user') {
                    showMessage(getErrorMessage(error));
                } else {
                    document.getElementById('authMessage').innerText = '';
                }
            }
        });
    </script>

    <script src="script.js" defer></script>
</body>
</html>
