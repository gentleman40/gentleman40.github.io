<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Портфолио веб-разработчика — проекты, контакты и вход/регистрация.">
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <title>Портфолио разработчика</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* subtle decorative background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.06) 1px, transparent 1px),
                radial-gradient(circle at 90% 80%, rgba(255,255,255,0.04) 1px, transparent 1px),
                radial-gradient(circle at 50% 40%, rgba(255,255,255,0.03) 1px, transparent 1px);
            pointer-events: none;
            z-index: -1;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        nav {
            background: #007bff;
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border-bottom: 1px solid #0056b3;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
            gap: 0.3rem;
            max-width: 100vw;
        }

        nav li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.92rem;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            white-space: nowrap;
        }

        nav li a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .neon-title {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            padding: 0;
            margin: 15px 0 10px;
            letter-spacing: 2px;
            animation: title-rainbow 4s infinite alternate;
            text-shadow: 0 0 10px currentColor;
            width: 100%;
        }

        @keyframes title-rainbow {
            0%   { color: #00ffcc; }
            25%  { color: #00ccff; }
            50%  { color: #ffff00; }
            75%  { color: #ff5500; }
            100% { color: #33ff99; }
        }

        .neon-frame {
            width: 100%;
            padding-top: 56.25%;
            border: 4px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            animation: neon-pulse 3.5s infinite alternate;
            box-shadow: 0 0 20px #00ffcc;
            margin: 0 0 16px;
            background: #000;
        }

        .neon-frame img,
        .neon-frame video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
        }

        @keyframes neon-pulse {
            0%   { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc, 0 0 35px #00ffcc; }
            50%  { border-color: #00ccff; box-shadow: 0 0 20px #00ccff, 0 0 35px #00ccff; }
            100% { border-color: #33ff99; box-shadow: 0 0 20px #33ff99, 0 0 35px #33ff99; }
        }

        .neon-btn {
            display: inline-block;
            padding: 10px 28px;
            background: transparent;
            color: #ff0000;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #ff0000;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px #ff0000;
            margin: 24px 0;
        }

        .neon-btn:hover {
            background: rgba(255, 0, 0, 0.15);
            box-shadow: 0 0 20px #ff3333, 0 0 35px #ff3333;
            color: white;
        }

        /* НОВЫЙ СТИЛЬ ФОРМЫ АВТОРИЗАЦИИ */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: #0a0a0a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
            margin: 0 0 40px;
        }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all 0.3s;
            z-index: 10;
        }

        .close-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .login-header {
            padding: 40px 30px 25px;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .gentleman-text {
            text-align: center;
            padding: 0 30px 20px;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            background: #1a1a1a;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            background: #252525;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
        }

        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
            font-size: 16px;
        }
