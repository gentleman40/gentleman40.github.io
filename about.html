    <style>
        /* Общие настройки — без margin collapse и с контролем отступов */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding-top: 70px; /* Высота фиксированной навигации */
            background: #0f0f15;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Неоновый стиль заголовка */
        @keyframes neonGlow {
            0%, 100% { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 15px #0ff, 0 0 30px #00f5ff; }
            50% { text-shadow: 0 0 3px #0ff, 0 0 8px #0ff, 0 0 12px #0ff, 0 0 25px #00f5ff; }
        }
        h2 {
            font-size: 2.4rem;
            text-align: center;
            margin: 30px 0 25px;
            color: #fff;
            animation: neonGlow 2s infinite alternate;
            letter-spacing: 1px;
        }

        /* Контейнер для контента — строгие отступы */
        .about-content {
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Фото в неоновой рамке */
        .neon-frame {
            display: block;
            margin: 25px auto 30px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 12px #00f5ff, 0 0 20px rgba(0, 245, 255, 0.5);
            border: 3px solid transparent;
        }
        .neon-frame::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f5ff, #00ff9d, #00f5ff);
            z-index: -1;
            animation: rotate 3s linear infinite;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .neon-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #111;
        }

        p {
            font-size: 1.1rem;
            margin: 16px 0;
            text-align: center;
            color: #e0e0ff;
        }

        /* Кнопка "Подробнее" — неон + клик */
        .btn {
            display: block;
            margin: 25px auto;
            padding: 12px 30px;
            background: transparent;
            color: #00f5ff;
            border: 2px solid #00f5ff;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 15px #00f5ff;
        }

        /* Скрытие/показ дополнительного текста */
        .hidden {
            display: none;
        }
        .show {
            display: block;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Навыки — неоновые теги */
        .skills {
            margin-top: 30px;
            text-align: center;
        }
        .skills h3 {
            margin-bottom: 15px;

        }

            border: 1px solid #007bff;
