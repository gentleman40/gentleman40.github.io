<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Обо мне</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --nav-height: 64px;
            --bg: #0f0f15;
            --accent: #00f5ff;
            --muted: #e0e0ff;
        }

        /* Общие настройки */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            padding-top: var(--nav-height); /* высота фиксированной навигации */
            background: var(--bg);
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        /* Неоновый стиль заголовка */
        @keyframes neonGlow {
            0%, 100% { text-shadow: 0 0 5px var(--accent), 0 0 10px var(--accent), 0 0 15px var(--accent), 0 0 30px rgba(0,245,255,0.85); }
            50% { text-shadow: 0 0 3px var(--accent), 0 0 8px var(--accent), 0 0 12px var(--accent), 0 0 20px rgba(0,245,255,0.6); }
        }
        h2.page-title {
            font-size: 2.4rem;
            text-align: center;
            margin: 30px 0 25px;
            color: #fff;
            animation: neonGlow 2.2s infinite alternate;
            letter-spacing: 1px;
        }

        /* Контейнер для контента */
        .about-content {
            padding: 0 20px;
            max-width: 900px;
            margin: 0 auto 40px;
        }

        /* Фото в неоновой рамке */
        .neon-frame {
            display: block;
            margin: 25px auto 30px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 12px rgba(0,245,255,0.9), 0 0 20px rgba(0,245,255,0.35);
            background: #0b0b0d;
        }
        .neon-frame::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f5ff, #00ff9d, #00f5ff);
            filter: blur(6px);
            z-index: 0;
            opacity: 0.85;
            pointer-events: none;
        }
        .neon-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            position: relative;
            z-index: 1;
            background: #111;
        }

        p {
            font-size: 1.06rem;
            margin: 16px 0;
            text-align: center;
            color: var(--muted);
        }

        /* Кнопка "Подробнее" */
        .btn {
            display: block;
            margin: 25px auto;
            padding: 12px 30px;
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.22s ease;
        }
        .btn:hover,
        .btn:focus {
            background: rgba(0, 245, 255, 0.08);
            box-shadow: 0 0 15px rgba(0,245,255,0.25);
            outline: none;
        }

        /* Скрытие/показ дополнительного текста */
        .hidden {
            display: none;
        }
        .show {
            display: block;
            animation: fadeIn 0.36s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Навыки */
        .skills {
            margin-top: 30px;
            text-align: center;
        }
        .skills h3 {
            margin-bottom: 15px;
            color: var(--accent);
            font-size: 1.25rem;
        }
        .skill {
            display: inline-block;
            background: rgba(0, 123, 255, 0.08);
            color: var(--accent);
            padding: 8px 18px;
            margin: 6px;
            border-radius: 30px;
            font-weight: 700;
            border: 1px solid rgba(0,123,255,0.25);
            text-shadow: 0 0 6px rgba(0,245,255,0.25);
            transition: transform 0.14s ease;
        }
        .skill:hover {
            transform: translateY(-2px) scale(1.03);
            background: rgba(0, 245, 255, 0.06);
        }

        footer.site-footer {
            text-align: center;
            padding: 25px 0;
            color: #aaa;
            font-size: 0.95rem;
            margin-top: 30px;
            border-top: 1px solid rgba(0, 123, 255, 0.08);
        }

        /* Адаптация под мобильные */
        @media (max-width: 600px) {
            h2.page-title { font-size: 2rem; margin-top: 18px; }
            .neon-frame { width: 180px; height: 180px; margin-top: 18px; }
            .about-content { padding: 0 15px; }
            p { font-size: 1rem; }
        }
    </style>
</head>
